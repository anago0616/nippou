<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>工事日報 印刷</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2e7d32">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="大工園日報">
<script src="config.js"></script>
<style>
  @page { size: A4 landscape; margin: 8mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Yu Gothic", "MS PGothic", "Meiryo", sans-serif; font-size: 10pt; color: #000; background: #888; }
  .toolbar { position: fixed; top: 0; left: 0; right: 0; background: #333; color: #fff; padding: 8px 16px; display: flex; gap: 12px; align-items: center; z-index: 10; }
  .toolbar button { padding: 6px 18px; font-size: 14px; cursor: pointer; }
  .sheets { padding: 50px 10px 20px; }

  .sheet {
    width: 281mm; height: 193mm; background: #fff; margin: 0 auto 10px;
    padding: 3mm; page-break-after: always; overflow: hidden; position: relative;
  }
  .sheet:last-child { page-break-after: auto; }

  .bordered { border: 1.2pt solid #000; }
  .center { text-align: center; }
  .vlabel { writing-mode: vertical-rl; text-orientation: upright; text-align: center; letter-spacing: 2px; }

  /* ---- ヘッダー ---- */
  .head-row { display: flex; justify-content: space-between; align-items: flex-start; height: 12mm; }
  .title-box { width: 60mm; height: 10mm; border: 1.2pt solid #000; display: flex; align-items: center; justify-content: center; font-size: 14pt; font-weight: bold; letter-spacing: 6px; }
  .company-box { width: 90mm; height: 9mm; border: 1.2pt solid #000; display: flex; }
  .company-box .c1 { flex: 1; display: flex; align-items: center; padding-left: 3mm; font-size: 9pt; }
  .company-box .c2 { width: 28mm; border-left: .6pt solid #000; display: flex; align-items: center; justify-content: center; font-size: 11pt; }

  .date-row { display: flex; justify-content: space-between; height: 8mm; margin-top: 1mm; }
  .date-left { display: flex; }
  .date-left div { border: 1.2pt solid #000; border-right: none; display: flex; align-items: center; justify-content: center; padding: 0 2mm; }
  .date-left div:last-child { border-right: 1.2pt solid #000; }
  .dcell { min-width: 16mm; }
  .date-right { display: flex; }
  .date-right div { border: 1.2pt solid #000; border-right: none; display: flex; align-items: center; justify-content: center; padding: 0 2mm; }
  .date-right div:last-child { border-right: 1.2pt solid #000; }
  .tval { min-width: 20mm; font-size: 11pt; }

  /* ---- 工事情報テーブル ---- */
  table.kouji { width: 100%; border-collapse: collapse; margin-top: 1mm; }
  table.kouji th, table.kouji td { border: 1.2pt solid #000; }
  table.kouji th { font-weight: normal; font-size: 9pt; height: 6mm; letter-spacing: 4px; }
  table.kouji td { height: 24mm; vertical-align: middle; text-align: center; padding: 1mm; font-size: 10.5pt; }
  table.kouji td.small { font-size: 9.5pt; }

  /* ---- メインブロック ---- */
  .main { display: flex; border: 1.2pt solid #000; margin-top: 2.5mm; height: 128mm; }
  .main-left { flex: 1; display: flex; flex-direction: column; border-right: 1.2pt solid #000; }
  .main-right { width: 52mm; display: flex; flex-direction: column; }

  .sec-hdr { border-bottom: .6pt solid #000; text-align: center; font-size: 9pt; height: 5mm; line-height: 5mm; }

  /* 人員 */
  .jinin { display: flex; height: 44mm; border-bottom: .6pt solid #000; }
  .jinin > div { border-right: .6pt solid #000; }
  .jinin > div:last-child { border-right: none; }
  .jlabel { width: 7mm; display: flex; align-items: center; justify-content: center; font-size: 9pt; }
  .jbox { flex: 1; padding: 1mm; font-size: 9.5pt; overflow: hidden; }
  .jbox .num { font-size: 11pt; text-align: center; border-bottom: .5pt dashed #999; padding-bottom: .5mm; margin-bottom: .5mm; }
  .sub-split { display: flex; flex-direction: column; flex: 1.6; }
  .sub-split .half { flex: 1; padding: 0; display: flex; flex-direction: column; }
  .sub-split .half + .half { border-top: .6pt solid #000; }
  .mini-hdr { text-align: center; font-size: 8pt; border-bottom: .5pt solid #000; height: 4mm; line-height: 4mm; }
  .mini-body { flex: 1; padding: 1mm; font-size: 9.5pt; overflow: hidden; }
  .ab-row { display: flex; flex: 1; }
  .ab-row div { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 10pt; }
  .ab-row div + div { border-left: .5pt solid #000; }

  /* 車両 */
  .sharyo { display: flex; height: 34mm; border-bottom: .6pt solid #000; }
  .sharyo > div { border-right: .6pt solid #000; display: flex; flex-direction: column; }
  .sharyo > div:last-child { border-right: none; }
  .sharyo .col-hdr { text-align: center; font-size: 9pt; border-bottom: .5pt solid #000; height: 4.5mm; line-height: 4.5mm; }
  .sharyo .col-body { flex: 1; padding: 1mm; font-size: 9.5pt; overflow: hidden; white-space: pre-wrap; }
  .s-jisha { flex: 1; } .s-daikuen { flex: 1.4; } .s-lease { flex: 1.4; }
  .lease-split { display: flex; flex: 1; }
  .lease-split .lmoto { width: 16mm; border-right: .5pt solid #000; display: flex; flex-direction: column; }
  .lease-split .lmoto .lh { font-size: 8pt; text-align: center; border-bottom: .5pt solid #000; }
  .lease-split .lmoto .lb { flex: 1; padding: 1mm; font-size: 9pt; }
  .lease-split .lname { flex: 1; display: flex; flex-direction: column; }
  .lease-split .lname .lh { font-size: 8pt; text-align: center; border-bottom: .5pt solid #000; }
  .lease-split .lname .lb { flex: 1; padding: 1mm; font-size: 9.5pt; }

  /* 備考・施工数量 */
  .bottom { display: flex; flex: 1; }
  .bikou { flex: 1; border-right: .6pt solid #000; display: flex; flex-direction: column; }
  .bikou .col-hdr, .sekou .col-hdr { text-align: center; font-size: 9pt; border-bottom: .5pt solid #000; height: 4.5mm; line-height: 4.5mm; }
  .bikou .col-body { flex: 1; padding: 1mm; font-size: 9.5pt; white-space: pre-wrap; overflow: hidden; }
  .sekou { flex: 1.2; display: flex; flex-direction: column; }
  table.sekou-t { width: 100%; border-collapse: collapse; flex: 1; }
  table.sekou-t th { border: .5pt solid #000; border-top: none; font-weight: normal; font-size: 8.5pt; height: 4.5mm; }
  table.sekou-t td { border: .5pt solid #000; font-size: 9pt; height: 6mm; padding: 0 1mm; text-align: center; }
  table.sekou-t th:first-child, table.sekou-t td:first-child { border-left: none; }
  table.sekou-t th:last-child, table.sekou-t td:last-child { border-right: none; }
  table.sekou-t tr:last-child td { border-bottom: none; }

  /* 右カラム */
  .r-hdr { text-align: center; font-size: 9pt; border-bottom: .5pt solid #000; height: 4.5mm; line-height: 4.5mm; background: #fff; }
  .r-body { padding: 1mm; font-size: 9pt; white-space: pre-wrap; overflow: hidden; border-bottom: .5pt solid #000; }
  .r-body:last-child { border-bottom: none; }
  .r-claim { height: 24mm; }
  .r-ctaiou { height: 22mm; }
  .r-kikai-line { display: flex; height: 5.5mm; border-bottom: .5pt solid #000; font-size: 9pt; align-items: center; }
  .r-kikai-line .n { width: 6mm; text-align: center; border-right: .5pt solid #000; align-self: stretch; display: flex; align-items: center; justify-content: center; }
  .r-kikai-line .v { flex: 1; padding: 0 1mm; overflow: hidden; white-space: nowrap; }
  .r-kjou { height: 20mm; }
  .r-ktai { flex: 1; }

  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .sheets { padding: 0; }
    .sheet { margin: 0; box-shadow: none; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <button onclick="window.print()">印刷 / PDF保存</button>
  <span id="info"></span>
</div>
<div class="sheets" id="sheets"></div>

<script>
let MASTERS = {};
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function warekiParts(dateStr) {
  if (!dateStr) return { nen: "", tsuki: "", hi: "", youbi: "" };
  const d = new Date(dateStr + "T00:00:00");
  const y = d.getFullYear();
  const reiwa = y - 2018; // 令和
  const youbi = ["日", "月", "火", "水", "木", "金", "土"][d.getDay()];
  return { nen: reiwa, tsuki: d.getMonth() + 1, hi: d.getDate(), youbi };
}

function renderSheet(r) {
  const w = warekiParts(r.date);
  const j = r.jinin || {};
  const sekou = (r.sekou || []).slice(0, 8);
  while (sekou.length < 8) sekou.push({});
  const numOr = v => (v === "" || v == null || Number(v) === 0) ? "" : v + " 人";
  const jishaW = r.sagyouin_jisha || [];
  const daikuenW = r.sagyouin_daikuen || [];
  const cnt = a => a.length ? a.length + " 人" : "";

  return `
  <div class="sheet">
    <div class="head-row">
      <div class="title-box">工事日報</div>
      <div class="company-box">
        <div class="c1">${esc(MASTERS.company || "")}　報告者：</div>
        <div class="c2">${esc(r.reporter)}</div>
      </div>
    </div>

    <div class="date-row">
      <div class="date-left">
        <div>令和 ${w.nen} 年</div>
        <div class="dcell">${w.tsuki} 月</div>
        <div class="dcell">${w.hi} 日</div>
        <div class="dcell">${w.youbi} 曜日</div>
        <div class="dcell">( ${esc(r.weather || "")} )</div>
      </div>
      <div class="date-right">
        <div>出社</div><div class="tval">${esc(r.shussha || "")}</div>
        <div>帰社</div><div class="tval">${esc(r.kisha || "")}</div>
      </div>
    </div>

    <table class="kouji">
      <tr>
        <th style="width:13%">工事番号</th>
        <th style="width:24%">工事名</th>
        <th style="width:15%">発注者</th>
        <th style="width:18%">工事場所</th>
        <th style="width:16%">工種</th>
        <th style="width:14%">時間</th>
      </tr>
      <tr>
        <td></td>
        <td class="small">${esc(r.kouji_mei)}</td>
        <td class="small">${esc(r.hacchusha)}</td>
        <td class="small">${esc(r.kouji_basho)}</td>
        <td class="small">${esc(r.koushu)}</td>
        <td>${esc(r.jikan_from || "")}<br>～<br>${esc(r.jikan_to || "")}</td>
      </tr>
    </table>

    <div class="main">
      <div class="main-left">
        <div class="sec-hdr">①</div>
        <div class="sec-hdr">人員</div>
        <div class="jinin">
          <div class="jlabel"><span class="vlabel">自社</span></div>
          <div class="jbox" style="flex:1.1;">
            <div class="num">${cnt(jishaW)}</div>
            ${esc(jishaW.join("、"))}
          </div>
          <div class="jlabel"><span class="vlabel">外注</span></div>
          <div class="jlabel"><span class="vlabel">${esc(MASTERS.partner || "")}</span></div>
          <div class="jbox" style="flex:1.3;">
            <div class="num">${cnt(daikuenW)}</div>
            ${esc(daikuenW.join("、"))}
          </div>
          <div class="jlabel"><span class="vlabel">その他</span></div>
          <div class="sub-split">
            <div class="half">
              <div class="mini-hdr">会社名</div>
              <div class="mini-body">${esc(j.sonota_kaisha || "")}　${numOr(j.sonota)}</div>
            </div>
            <div class="half">
              <div class="mini-hdr">作業員名</div>
              <div class="mini-body">${esc(r.sagyouin_gaichu || "")}</div>
            </div>
          </div>
          <div class="jlabel"><span class="vlabel">交通誘導員</span></div>
          <div class="sub-split" style="flex:1.2;">
            <div class="half">
              <div class="mini-hdr">会社名</div>
              <div class="mini-body">${esc(j.yudo_kaisha || "")}</div>
            </div>
            <div class="half">
              <div class="ab-row">
                <div>A</div><div>${numOr(j.yudo_a)}</div>
                <div>B</div><div>${numOr(j.yudo_b)}</div>
              </div>
            </div>
          </div>
        </div>

        <div class="sec-hdr">車両</div>
        <div class="sharyo">
          <div class="s-jisha">
            <div class="col-hdr">自社</div>
            <div class="col-body">${esc((r.sharyo_jisha || []).join("\n"))}</div>
          </div>
          <div class="s-daikuen">
            <div class="col-hdr">${esc(MASTERS.partner || "")}</div>
            <div class="col-body">${esc((r.sharyo_daikuen || []).join("\n"))}</div>
          </div>
          <div class="s-lease">
            <div class="col-hdr">リース</div>
            <div class="lease-split">
              <div class="lmoto">
                <div class="lh">貸出元</div>
                <div class="lb">${esc(r.lease_moto || "")}</div>
              </div>
              <div class="lname">
                <div class="lh">車両名</div>
                <div class="lb">${esc([r.lease_name, r.lease_name2].filter(Boolean).join("　"))}</div>
              </div>
            </div>
          </div>
        </div>

        <div class="bottom">
          <div class="bikou">
            <div class="col-hdr">備考</div>
            <div class="col-body">${esc(r.bikou || "")}</div>
          </div>
          <div class="sekou">
            <div class="col-hdr">工事施工数量</div>
            <table class="sekou-t">
              <tr><th style="width:44%">工種</th><th style="width:24%">管径</th><th style="width:16%">延長</th><th style="width:16%">箇所</th></tr>
              ${sekou.map(s => `<tr>
                <td style="text-align:left;">${esc(s.koushu || "")}</td>
                <td>${esc(s.kankei || "")}</td>
                <td>${esc(s.enchou || "")}</td>
                <td>${esc(s.kasho || "")}</td>
              </tr>`).join("")}
            </table>
          </div>
        </div>
      </div>

      <div class="main-right">
        <div class="r-hdr">クレーム状況</div>
        <div class="r-body r-claim">${esc(r.claim_joukyou || "")}</div>
        <div class="r-hdr">対応</div>
        <div class="r-body r-ctaiou">${esc(r.claim_taiou || "")}</div>
        <div class="r-hdr">使用機械の異常</div>
        <div class="r-kikai-line"><div class="n">①</div><div class="v">${esc(r.kikai1 || "")}</div></div>
        <div class="r-kikai-line"><div class="n">②</div><div class="v">${esc(r.kikai2 || "")}</div></div>
        <div class="r-hdr">状況</div>
        <div class="r-body r-kjou">${esc(r.kikai_joukyou || "")}</div>
        <div class="r-hdr">対応</div>
        <div class="r-body r-ktai" style="border-bottom:none;">${esc(r.kikai_taiou || "")}</div>
      </div>
    </div>
  </div>`;
}

const API = window.NIPPOU.api;
const CO  = window.NIPPOU.co;

function secret() { try { return localStorage.getItem("key") || ""; } catch (e) { return ""; } }

async function apiGet(params) {
  const q = new URLSearchParams(Object.assign({ co: CO, key: secret() }, params));
  const res = await fetch(API + "?" + q.toString());
  if (!res.ok) throw new Error("通信エラー");
  const d = await res.json();
  if (d && d.auth) { document.getElementById("info").textContent = "合言葉が必要です。入力画面から入り直してください。"; throw new Error("auth"); }
  return d;
}

async function init() {
  const params = new URLSearchParams(location.search);
  const q = { action: "list", full: "1" };
  if (params.get("ids")) q.ids = params.get("ids");
  else if (params.get("date")) q.date = params.get("date");
  else { document.getElementById("info").textContent = "対象が指定されていません"; return; }
  MASTERS = await apiGet({ action: "masters" });
  const list = await apiGet(q);
  document.getElementById("info").textContent = `${list.length} 件`;
  document.getElementById("sheets").innerHTML = list.map(renderSheet).join("");
}
init();
</script>
<script>
// アプリとしてホーム画面から起動できるようにする（https または localhost でのみ有効）
if ("serviceWorker" in navigator && window.isSecureContext) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js?v=7").catch(() => {}));
}
</script>
</body>
</html>
